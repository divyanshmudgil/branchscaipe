<!-- @dsCard group="Type" viewport="700x220" name="Display & Headings" subtitle="Orbitron display · Albert Sans H1–H4" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); }
  .wrap { box-sizing: border-box; width: 700px; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .spec { font: var(--text-body-sm); color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; width: 132px; flex: none; }
  .display { font-family: var(--font-brand); font-weight: 700; font-size: 40px; letter-spacing: 0.04em; color: var(--text-primary); line-height: 1; }
  .h1 { font: var(--text-h1); color: var(--text-primary); }
  .h2 { font: var(--text-h2); color: var(--text-primary); }
  .h3 { font: var(--text-h3); color: var(--text-primary); }
  .h4 { font: var(--text-h4); color: var(--text-primary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="spec">Display · Orbitron 64/700</span><span class="display">Branch</span></div>
    <div class="row"><span class="spec">H1 · 40 / 700</span><span class="h1">Calm intelligence</span></div>
    <div class="row"><span class="spec">H2 · 32 / 600</span><span class="h2">Explore every path</span></div>
    <div class="row"><span class="spec">H3 · 24 / 600</span><span class="h3">Merge back when ready</span></div>
    <div class="row"><span class="spec">H4 · 20 / 600</span><span class="h4">Branch from any message</span></div>
  </div>
</body>
</html>
