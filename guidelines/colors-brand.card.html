<!-- @dsCard group="Colors" viewport="700x170" name="Brand — Iris & Sky" subtitle="Primary iris ramp, secondary sky, accent lilac" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); }
  .wrap { box-sizing: border-box; width: 700px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .ramp { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 56px; display: flex; align-items: flex-end; padding: 6px; }
  .lbl { font: var(--weight-medium) 10px/1 var(--font-sans); }
  .row2 { display: flex; gap: 12px; }
  .chip { flex: 1; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; padding: 0 12px; font: var(--weight-semibold) 12px/1 var(--font-sans); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ramp">
      <div class="sw" style="background:var(--c-iris-100)"><span class="lbl" style="color:var(--c-iris-700)">100</span></div>
      <div class="sw" style="background:var(--c-iris-300)"><span class="lbl" style="color:var(--c-iris-900)">300</span></div>
      <div class="sw" style="background:var(--c-iris-500)"><span class="lbl" style="color:#fff">500 · primary</span></div>
      <div class="sw" style="background:var(--c-iris-600)"><span class="lbl" style="color:#fff">600</span></div>
      <div class="sw" style="background:var(--c-iris-700)"><span class="lbl" style="color:#fff">700</span></div>
      <div class="sw" style="background:var(--c-iris-900)"><span class="lbl" style="color:#fff">900</span></div>
    </div>
    <div class="row2">
      <div class="chip" style="background:var(--brand-secondary);color:#fff">Secondary · sky</div>
      <div class="chip" style="background:var(--brand-accent);color:var(--text-on-accent)">Accent · lilac</div>
      <div class="chip" style="background:var(--brand-primary-soft);color:var(--text-brand)">Primary soft</div>
    </div>
  </div>
</body>
</html>
