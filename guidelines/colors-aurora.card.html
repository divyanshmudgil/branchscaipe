<!-- @dsCard group="Colors" viewport="700x150" name="Aurora accents" subtitle="The soft pastel family behind gradients & highlights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); }
  .wrap { box-sizing: border-box; width: 700px; padding: 24px; display: flex; gap: 12px; }
  .sw { flex: 1; height: 96px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 10px; box-shadow: var(--shadow-xs); }
  .lbl { font: var(--weight-semibold) 11px/1.3 var(--font-sans); color: var(--c-ink-800); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:var(--c-aurora-iris)"><span class="lbl">iris</span></div>
    <div class="sw" style="background:var(--c-aurora-peri)"><span class="lbl">peri</span></div>
    <div class="sw" style="background:var(--c-aurora-sky)"><span class="lbl">sky</span></div>
    <div class="sw" style="background:var(--c-aurora-mint)"><span class="lbl">mint</span></div>
    <div class="sw" style="background:var(--c-aurora-blush)"><span class="lbl">blush</span></div>
    <div class="sw" style="background:var(--c-aurora-peach)"><span class="lbl">peach</span></div>
    <div class="sw" style="background:var(--c-aurora-lilac)"><span class="lbl">lilac</span></div>
  </div>
</body>
</html>
