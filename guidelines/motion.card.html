<!-- @dsCard group="Motion" viewport="700x180" name="Motion" subtitle="Calm timing & easing — hover to preview" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); }
  .wrap { box-sizing: border-box; width: 700px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .lbl { width: 150px; flex: none; font: var(--weight-medium) 12px/1.3 var(--font-sans); color: var(--text-secondary); }
  .lbl b { color: var(--text-primary); }
  .track { flex: 1; height: 22px; background: var(--surface-2); border-radius: var(--radius-pill); position: relative; }
  .dot { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--gradient-brand); box-shadow: var(--shadow-glow-soft); }
  .wrap:hover .dot { left: calc(100% - 19px); }
  .r1 .dot { transition: left var(--motion-fast) var(--ease-standard); }
  .r2 .dot { transition: left var(--motion-medium) var(--ease-calm); }
  .r3 .dot { transition: left var(--motion-slow) var(--ease-spring); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row r1"><span class="lbl"><b>Fast</b> · 140ms<br>ease-standard</span><div class="track"><div class="dot"></div></div></div>
    <div class="row r2"><span class="lbl"><b>Medium</b> · 240ms<br>ease-calm</span><div class="track"><div class="dot"></div></div></div>
    <div class="row r3"><span class="lbl"><b>Slow</b> · 420ms<br>ease-spring</span><div class="track"><div class="dot"></div></div></div>
  </div>
</body>
</html>
