<!-- @dsCard group="Spacing" viewport="700x150" name="Radius scale" subtitle="12 / 16 / 20 / 24 / 32 + pill — soft, no harsh geometry" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-1); }
  .wrap { box-sizing: border-box; width: 700px; padding: 24px; display: flex; gap: 14px; align-items: flex-end; }
  .cell { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 100%; height: 64px; background: var(--surface-2); border: 1.5px solid var(--border-brand); }
  .lbl { font: var(--weight-medium) 11px/1 var(--font-sans); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm · 12</span></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 16</span></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 20</span></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl · 24</span></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="lbl">2xl · 32</span></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="lbl">pill</span></div>
  </div>
</body>
</html>
