<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-aurora); }
  .wrap {
    box-sizing: border-box; width: 700px; height: 180px;
    display: flex; align-items: center; justify-content: center;
    background: var(--gradient-dawn); position: relative; overflow: hidden;
  }
  .field { position: absolute; inset: -20%; background: var(--gradient-aurora); filter: blur(6px); z-index: 0; }
  .mark {
    position: relative; z-index: 1;
    font-family: var(--font-brand); font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 34px; color: var(--text-primary);
  }
  .dot { color: var(--brand-primary); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="field"></div>
    <div class="mark">BRANCHSCAIPE</div>
  </div>
</body>
</html>
