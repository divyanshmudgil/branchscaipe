<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces & Text — Light / Dark" subtitle="Layered surfaces and text ramp in both themes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .wrap { box-sizing: border-box; width: 700px; display: flex; }
  .pane { flex: 1; padding: 22px; box-sizing: border-box; background: var(--bg); }
  .tag { font: var(--weight-semibold) 11px/1 var(--font-sans); color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
  .surfaces { display: flex; gap: 8px; margin-bottom: 16px; }
  .s { flex: 1; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); display: flex; align-items: center; justify-content: center; font: var(--weight-medium) 10px/1 var(--font-sans); color: var(--text-secondary); }
  .texts { display: flex; flex-direction: column; gap: 5px; }
  .t { font: var(--weight-medium) 13px/1.3 var(--font-sans); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="pane">
      <div class="tag">Light</div>
      <div class="surfaces">
        <div class="s" style="background:var(--surface-1)">1</div>
        <div class="s" style="background:var(--surface-2)">2</div>
        <div class="s" style="background:var(--surface-3)">3</div>
        <div class="s" style="background:var(--surface-selected)">sel</div>
      </div>
      <div class="texts">
        <span class="t" style="color:var(--text-primary)">Primary text</span>
        <span class="t" style="color:var(--text-secondary)">Secondary text</span>
        <span class="t" style="color:var(--text-muted)">Muted text</span>
        <span class="t" style="color:var(--text-disabled)">Disabled text</span>
      </div>
    </div>
    <div class="pane dark">
      <div class="tag">Dark</div>
      <div class="surfaces">
        <div class="s" style="background:var(--surface-1)">1</div>
        <div class="s" style="background:var(--surface-2)">2</div>
        <div class="s" style="background:var(--surface-3)">3</div>
        <div class="s" style="background:var(--surface-selected)">sel</div>
      </div>
      <div class="texts">
        <span class="t" style="color:var(--text-primary)">Primary text</span>
        <span class="t" style="color:var(--text-secondary)">Secondary text</span>
        <span class="t" style="color:var(--text-muted)">Muted text</span>
        <span class="t" style="color:var(--text-disabled)">Disabled text</span>
      </div>
    </div>
  </div>
</body>
</html>
