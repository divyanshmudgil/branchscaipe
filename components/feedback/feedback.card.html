<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-aurora); }
  #root { box-sizing: border-box; width: 700px; padding: 28px; display: flex; align-items: flex-start; gap: 28px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .lbl { font: var(--weight-semibold) 10px/1 var(--font-sans); color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.BranchscaipeDesignSystem_0d3c10;
  const { Tooltip, Menu, Toast, IconButton, Button } = NS;
  function Icon({ name, size = 18 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current && window.lucide) {
        ref.current.innerHTML = "";
        const i = document.createElement("i"); i.setAttribute("data-lucide", name); ref.current.appendChild(i);
        window.lucide.createIcons({ attrs: { width: size, height: size, "stroke-width": 1.75 }, nameAttr: "data-lucide" });
      }
    });
    return <span ref={ref} style={{ display: "inline-flex" }} />;
  }
  function Demo() {
    return (
      <>
        <div className="col">
          <span className="lbl">Toast</span>
          <Toast tone="success" icon={<Icon name="git-merge" />} title="Branch merged" description="Closure was merged into Hooks." onClose={()=>{}} />
        </div>
        <div className="col">
          <span className="lbl">Menu + Tooltip</span>
          <Menu open={true} trigger={null} items={[
            {id:'branch',label:'Branch from here',icon:<Icon name="git-branch" size={16}/>},
            {id:'merge',label:'Merge to parent',icon:<Icon name="git-merge" size={16}/>},
            {divider:true},
            {id:'del',label:'Delete branch',icon:<Icon name="trash-2" size={16}/>,danger:true},
          ]} />
          <Tooltip content="Branch from here" side="bottom"><IconButton icon={<Icon name="git-branch"/>} label="Branch" variant="soft" /></Tooltip>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
