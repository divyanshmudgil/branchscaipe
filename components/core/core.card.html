<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-1); }
  #root { box-sizing: border-box; width: 700px; padding: 26px; display: flex; flex-direction: column; gap: 18px; }
  .grp { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lbl { font: var(--weight-semibold) 10px/1 var(--font-sans); color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; width: 64px; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.BranchscaipeDesignSystem_0d3c10;
  const { Button, IconButton, Pill, Badge, Switch, Tabs, Avatar } = NS;

  function Icon({ name, size = 18, sw = 1.75 }) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current && window.lucide) {
        ref.current.innerHTML = "";
        const i = document.createElement("i");
        i.setAttribute("data-lucide", name);
        ref.current.appendChild(i);
        window.lucide.createIcons({ attrs: { width: size, height: size, "stroke-width": sw }, nameAttr: "data-lucide" });
      }
    });
    return <span ref={ref} style={{ display: "inline-flex" }} />;
  }

  function Demo() {
    const [tab, setTab] = React.useState("chat");
    const [on, setOn] = React.useState(true);
    return (
      <>
        <div className="grp">
          <span className="lbl">Button</span>
          <Button variant="brand" iconLeft={<Icon name="git-branch" size={16} />}>Branch</Button>
          <Button variant="primary">Send</Button>
          <Button variant="secondary">Cancel</Button>
          <Button variant="ghost" iconLeft={<Icon name="rotate-ccw" size={16} />}>Retry</Button>
          <Button variant="danger" size="sm">Discard</Button>
        </div>
        <div className="grp">
          <span className="lbl">Icon</span>
          <IconButton icon={<Icon name="search" />} label="Search" />
          <IconButton icon={<Icon name="settings" />} label="Settings" variant="soft" active />
          <IconButton icon={<Icon name="git-merge" />} label="Merge" variant="solid" />
          <IconButton icon={<Icon name="more-horizontal" />} label="More" />
        </div>
        <div className="grp">
          <span className="lbl">Pill</span>
          <Pill iconLeft={<Icon name="sliders-horizontal" size={14} />} selected>Tools</Pill>
          <Pill>Hooks</Pill>
          <Pill removable onRemove={() => {}}>Closure</Pill>
          <Badge tone="new" soft={false}>NEW</Badge>
          <Badge tone="success" dot>Merged</Badge>
          <Badge tone="brand">3 branches</Badge>
        </div>
        <div className="grp">
          <span className="lbl">Misc</span>
          <Tabs value={tab} onChange={setTab} items={[{ id: "chat", label: "Chat" }, { id: "branches", label: "Branches" }, { id: "kb", label: "Knowledge" }]} />
          <Switch checked={on} onChange={setOn} label="Dark" />
          <Avatar name="Maya Lin" size={36} />
          <Avatar kind="assistant" size={36} />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
