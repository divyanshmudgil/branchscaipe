<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg); }
  #root { box-sizing: border-box; width: 700px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .nav { width: 280px; padding: 16px; background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.BranchscaipeDesignSystem_0d3c10;
  const { BranchBreadcrumb, BranchIndicator, ContextBanner, MergeBanner, BranchNavigator } = NS;
  const tree = [{ id:'hooks', label:'Hooks', children:[
    { id:'closure', label:'Closure', children:[{ id:'example', label:'Example' },{ id:'edge', label:'Edge case' }] },
    { id:'other', label:'Another topic' }] }];
  function Demo() {
    const [active, setActive] = React.useState('edge');
    const [cur, setCur] = React.useState(2);
    return (
      <>
        <div className="row">
          <BranchBreadcrumb path={["Hooks","Closure"]} />
          <BranchIndicator count={3} current={cur} onPrev={()=>setCur(c=>Math.max(1,c-1))} onNext={()=>setCur(c=>Math.min(3,c+1))} />
        </div>
        <ContextBanner from="Hooks" />
        <MergeBanner source="Closure" parent="Hooks" scope="chat" />
        <div className="nav"><BranchNavigator count={5} tree={tree} activeId={active} onSelect={setActive} /></div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
