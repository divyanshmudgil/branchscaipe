<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branchscaipe — AI assistant</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../_ds_bundle.js?v=i3f"></script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--bg); }
  /* popover/menu entrance (kept local so it's available without mounting Select) */
  @keyframes bscPop { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
  /* jump-to-message flash when navigating from search / starred / merge */
  @keyframes bscFlash { 0% { background: var(--surface-selected); } 100% { background: transparent; } }
  .bsc-flash { animation: bscFlash 1.6s var(--ease-calm); border-radius: var(--radius-lg); }
  @media (prefers-reduced-motion: reduce) { .bsc-flash { animation: none; } }
  /* spinner for voice transcribing state */
  @keyframes bscSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ── Sidebar accent sphere ───────────────────────────── */
  /* Plain solid sidebar — white in light, black in dark. */
  .bsc-sidebar {
    background: var(--surface-1);
  }
  .dark .bsc-sidebar {
    background: var(--bg);
  }

  /* ── Logo reveal animation ─────────────────────────────────────── */
  @keyframes bscLogoLeft {
    from { opacity: 0; transform: translateX(22px); }
    to   { opacity: 1; transform: translateX(0);    }
  }
  @keyframes bscLogoRight {
    from { opacity: 0; transform: translateX(-22px); }
    to   { opacity: 1; transform: translateX(0);     }
  }
  @keyframes bscLogoGlow {
    0%   { filter: drop-shadow(0 0 20px oklch(0.60 0.24 262 / 0.90)); }
    55%  { filter: drop-shadow(0 0 10px oklch(0.62 0.20 262 / 0.55)); }
    100% { filter: none; }
  }
  /* Safety: if motion is reduced (or the animation can't run), always show the full wordmark */
  @media (prefers-reduced-motion: reduce) {
    .bsc-wordmark > span { animation: none !important; opacity: 1 !important; filter: none !important; transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js?v=i3f"></script>
<script type="text/babel" src="Icon.jsx?v=i3f"></script>
<script type="text/babel" src="Sidebar.jsx?v=i3f"></script>
<script type="text/babel" src="LineageBar.jsx?v=i3f"></script>
<script type="text/babel" src="Panel.jsx?v=i3f"></script>
<script type="text/babel" src="Response.jsx?v=i3f"></script>
<script type="text/babel" src="ChatThread.jsx?v=i3f"></script>
<script type="text/babel" src="TopBar.jsx?v=i3f"></script>
<script type="text/babel" src="Screens.jsx?v=i3f"></script>
<script type="text/babel" src="App.jsx?v=i3f"></script>
<script type="text/babel">
  const Root = window.App;
  ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
